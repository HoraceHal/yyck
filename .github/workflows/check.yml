name: Check

# 发布由 Cloudflare 的 Git 集成负责(推送到 main 后自动构建部署)。
# 这里只做数据校验,避免有问题的课程数据被发布。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-data.js
